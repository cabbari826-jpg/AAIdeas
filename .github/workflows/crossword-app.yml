name: crossword-app
on:
  push:
    paths: ["crossword-app/**", ".github/workflows/crossword-app.yml"]
  pull_request:
    paths: ["crossword-app/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crossword-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: crossword-app/app/build/outputs/apk/debug/app-debug.apk
